name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

      - name: Trigger Automation Tests
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: playwright.yml # Must match the filename in automation repo
          repo: NextGenTech2/playwright-cucumber-java
          token: ${{ secrets.WORKFLOW_TOKEN }} # Ensure this secret is added in Dev repo
          wait-for-completion: true
          sync-status: true
